<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoVida | Contato</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <nav class="navbar">
    <div class="logo">Eco<span>Vida</span></div>

    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="reciclagem.html">Reciclagem</a></li>
      <li><a href="lixos.html">Tipos de lixo</a></li>
      <li><a href="producao.html">Produção</a></li>
      <li><a href="areas-verdes.html">Áreas verdes</a></li>
      <li><a href="quiz.html">Quiz</a></li>
      <li><a href="contato.html">Contato</a></li>
    </ul>

    <div>
      <button id="themeBtn" class="theme-btn">🌙</button>
      <button id="menuBtn" class="menu-btn">☰</button>
    </div>
  </nav>
</header>

<section class="page-banner">
  <h1>Contato</h1>
  <p>Envie sua sugestão para melhorar o projeto EcoVida.</p>
</section>

<section>
  <div class="contact-box">

    <form 
      action="https://sheetdb.io/api/v1/jde9p6x41odi0" 
      method="post" 
      target="hidden_iframe"
      onsubmit="mostrarMensagem()"
    >

      <div class="input-group">
        <label for="nome">Nome</label>
        <input 
          type="text" 
          id="nome" 
          name="data[Nome]" 
          placeholder="Digite seu nome" 
          required
        >
      </div>

      <div class="input-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          name="data[Email]" 
          placeholder="Digite seu email" 
          required
        >
      </div>

      <div class="input-group">
        <label for="sugestao">Sugestão</label>
        <textarea 
          id="sugestao" 
          name="data[Sugestao]" 
          rows="6" 
          placeholder="Digite sua sugestão"
          required
        ></textarea>
      </div>

      <button type="submit" class="btn">Enviar sugestão</button>

      <p id="contactStatus" class="result" style="display:none;">
        ✅ Sugestão enviada com sucesso!
      </p>

    </form>

    <iframe name="hidden_iframe" style="display:none;"></iframe>

  </div>
</section>

<footer>
  <p>EcoVida © 2026</p>
</footer>

<script>
function mostrarMensagem(){
  document.getElementById("contactStatus").style.display = "block";

  setTimeout(function(){
    document.getElementById("nome").value = "";
    document.getElementById("email").value = "";
    document.getElementById("sugestao").value = "";
  }, 800);
}
</script>

<script src="script.js"></script>
</body>
</html>
